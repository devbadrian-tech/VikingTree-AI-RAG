services:
  app:
    build: .
    ports:
      - "127.0.0.1:${ARBOR_PORT:-8787}:80"
    env_file: ${ARBOR_ENV_FILE:-.env}
    environment:
      ARBOR_API_TOKEN: ${ARBOR_API_TOKEN:?Set ARBOR_API_TOKEN in .env before starting Docker}
      ARBOR_DB: /var/www/html/data/arbor.sqlite
      ARBOR_EXTERNAL_WORKER: "1"
    volumes:
      - arbor-data:/var/www/html/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "php", "-r", "exit(@file_get_contents('http://127.0.0.1/') === false ? 1 : 0);"]
      interval: 30s
      timeout: 5s
      retries: 3
  worker:
    build: .
    command: ["php", "bin/auto.php", "--daemon"]
    user: www-data
    env_file: ${ARBOR_ENV_FILE:-.env}
    environment:
      ARBOR_DB: /var/www/html/data/arbor.sqlite
      ARBOR_EXTERNAL_WORKER: "1"
    volumes:
      - arbor-data:/var/www/html/data
    depends_on:
      app:
        condition: service_healthy
    restart: unless-stopped
volumes:
  arbor-data:
